[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableCORS = false
port = 8501

[browser]
gatherUsageStats = false 


[server]
enableStaticServing = false

[runner]
enforceSerializableSessionState = false

[client]
showErrorDetails = true